version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # If you use Google GenAI in production, pass the key here
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persist SQLite database and any new models outside the container
      - sentinel-data:/app/

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sentinel-data:
